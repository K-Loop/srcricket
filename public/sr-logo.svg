<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a00"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#F5A900"/>
    </radialGradient>
  </defs>
  <!-- Black circle background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#F5A900" stroke-width="1" opacity="0.4"/>
  
  <!-- S letter -->
  <path d="M55 72 C55 58, 75 52, 88 58 C100 64, 100 76, 88 82 C76 88, 60 90, 60 104 C60 118, 80 124, 94 118 C108 112, 110 100, 108 96" 
        fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- R letter -->
  <path d="M108 60 L108 120" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M108 60 C108 60, 140 60, 140 78 C140 96, 108 96, 108 96" 
        fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M120 96 L148 120" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
</svg>
